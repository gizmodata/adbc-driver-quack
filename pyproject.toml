[project]
name = "adbc-driver-quack"
description = "An Apache Arrow ADBC driver for DuckDB's Quack remote protocol (DuckDB 2.0), by GizmoData."
authors = [{ name = "GizmoData", email = "support@gizmodata.com" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = [
    "adbc",
    "adbc-driver",
    "apache-arrow",
    "arrow",
    "columnar",
    "database",
    "duckdb",
    "gizmodata",
    "hardcharger",
    "olap",
    "pyarrow",
    "quack",
    "sql",
]
dependencies = [
    # The current release (1.13): driver manifests, connection profiles
    # (profile=..., uri="profile://..."), quack:// scheme lookup.
    "adbc-driver-manager >=1.13.0",
    "importlib-resources >=1.3",
    # pyarrow is required for any DBAPI cursor method that returns
    # Arrow data (fetch_arrow_table, fetch_record_batch, etc.) — i.e.
    # every quickstart example in the README. Real dep, not optional.
    # The floor stays low on purpose: this is a library installed into
    # users' environments, and the Arrow C Data interface it relies on is
    # stable across these releases. CI tests the latest (see [test]).
    "pyarrow >=14.0.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.optional-dependencies]
dbapi = ["pandas"]
# Latest releases. duckdb 2.0 serves Quack protocol 3, which this driver
# speaks; hardcharger runs the Quack -> Hardcharger tests
# (https://gizmodata.com/hardcharger).
test = [
    "pandas >=3.1.1",
    "pytest >=9.2.0",
    "duckdb >=2.0.0",
    "hardcharger[adbc] >=2.10.0",
]

[project.urls]
homepage = "https://github.com/gizmodata/adbc-driver-quack"
hardcharger = "https://gizmodata.com/hardcharger"
repository = "https://github.com/gizmodata/adbc-driver-quack"
issues = "https://github.com/gizmodata/adbc-driver-quack/issues"

[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
# Python sources live under python/ so the repo can be polyglot (Go at
# the root, Python here, cgo wrapper in pkg/quack/). Be explicit about
# what we package — auto-find would also sweep up python/tests/.
packages = ["adbc_driver_quack"]
package-dir = { "" = "python" }

[tool.pytest.ini_options]
xfail_strict = true
testpaths = ["python/tests"]
markers = [
    "integration: requires a live DuckDB 2.0 Quack server (started by conftest.py)",
    "hardcharger: additionally requires Hardcharger (ADBC_QUACK_TEST_HARDCHARGER_URI, or the hardcharger package)",
    "duckdb_ext: drives the driver from DuckDB extensions (adbc_scanner, Columnar's adbc)",
]
